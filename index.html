

<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#4b0712">

<title>Calendario Adviento Emma</title>

<style>

*{box-sizing:border-box}

body{

 margin:0;

 font-family:Georgia,'Times New Roman',serif;

 background:radial-gradient(circle at top,#8b1d30,#35040c 75%);

 color:#fff8f1;

 min-height:100vh;

}

button{font:inherit;cursor:pointer}

.hidden{display:none!important}

#home{

 min-height:100vh;

 display:flex;

 flex-direction:column;

 align-items:center;

 justify-content:center;

 text-align:center;

 padding:24px;

}

.hero-photo{

 width:min(88vw,430px);

 height:min(58vh,520px);

 object-fit:cover;

 filter:grayscale(1);

 border:5px solid white;

}

h1{

 font-size:clamp(2rem,7vw,3.2rem);

 margin:22px 0 8px;

 font-weight:normal;

}

.subtitle{

 font-size:1.05rem;

 line-height:1.5;

 max-width:440px;

 margin:0 auto 24px;

}

.gift-start{

 border:0;

 background:#b51e35;

 color:white;

 border-radius:14px;

 padding:20px 30px;

 font-size:1.2rem;

 box-shadow:0 9px 0 #6d1020;

}

#calendar{

 padding:22px 14px 40px;

 max-width:760px;

 margin:auto;

 text-align:center;

}

.topbar{

 display:flex;

 justify-content:space-between;

 align-items:center;

 margin-bottom:20px;

}

.back,.music{

 background:#ffffff18;

 color:white;

 border:1px solid #ffffff55;

 border-radius:30px;

 padding:10px 14px;

}

.grid{

 display:grid;

 grid-template-columns:repeat(4,minmax(0,1fr));

 gap:12px;

}

.day{

 min-height:100px;

 border:1px solid #d6b36b;

 border-radius:12px;

 background:linear-gradient(145deg,#a51e34,#610c1c);

 color:white;

 display:flex;

 flex-direction:column;

 align-items:center;

 justify-content:center;

}

.day .num{font-size:1.8rem}

.day .gift{font-size:1.3rem}

.day.opened{

 background:linear-gradient(145deg,#d2a85c,#8b5a26);

}

.day.locked{opacity:.55}

#progress{margin:20px 0}

#modal{

 position:fixed;

 inset:0;

 background:#160006d9;

 display:flex;

 align-items:center;

 justify-content:center;

 padding:14px;

 z-index:5;

}

.paper{

 background:#fff8f1;

 color:#42121b;

 width:min(100%,650px);

 max-height:92vh;

 overflow:auto;

 border-radius:12px;

 padding:24px 20px 28px;

}

.close{

 float:right;

 border:0;

 background:#ead9d4;

 color:#42121b;

 border-radius:50%;

 width:36px;

 height:36px;

 font-size:1.2rem;

}

.paper h2{

 text-align:center;

 font-size:1.8rem;

 font-weight:normal;

 margin:12px 28px 20px;

}

.paper p{

 font-family:Arial,sans-serif;

 font-size:1rem;

 line-height:1.7;

 white-space:pre-line;

}

.media{

 display:block;

 max-width:100%;

 max-height:55vh;

 margin:16px auto;

 object-fit:contain;

 border-radius:8px;

}

.choice{

 display:block;

 width:100%;

 margin:9px 0;

 text-align:left;

 padding:12px;

 border:1px solid #d8c0b9;

 border-radius:9px;

 background:#f0e2dc;

 color:#42121b;

}

.actions{

 display:flex;

 justify-content:center;

 gap:10px;

 flex-wrap:wrap;

 margin-top:18px;

}

.actions button{

 border:0;

 border-radius:9px;

 padding:11px 16px;

 background:#8d1729;

 color:white;

}

.envelope{

 background:#8c1a2c;

 color:white;

 border:2px solid #d9b66f;

 border-radius:10px;

 padding:22px;

 margin:12px 0;

}

.small-note{

 font: .85rem Arial,sans-serif;

 text-align:center;

}

textarea{

 width:100%;

 min-height:95px;

 padding:12px;

 border:1px solid #c8aaa2;

 border-radius:8px;

}

.photo-grid{

 display:grid;

 grid-template-columns:repeat(2,1fr);

 gap:10px;

}

.photo-grid img{

 width:100%;

 height:190px;

 object-fit:cover;

 border-radius:7px;

}

.photo-grid figure{margin:0}

.photo-grid figcaption{

 text-align:center;

 margin:6px 0 10px;

}

@media(max-width:420px){

 .grid{gap:8px}

 .day{min-height:82px}

 .day .num{font-size:1.5rem}

 .paper{padding:18px 15px}

 .photo-grid img{height:145px}

}

</style>

</head>

<body>

<section id="home">

 <img class="hero-photo"

 src="8ab45570-f398-4989-87ca-93abf22fa6ca.jpeg"

 alt="Alejandro y Emma">

 <h1>24 razones para elegirte cada día</h1>

 <p class="subtitle">

 Cada cajita guarda un recuerdo, una sorpresa

 o algo que quiero decirte.

 </p>

 <button class="gift-start" onclick="showCalendar()">

 🎁 Abrir mi calendario

 </button>

</section>

<section id="calendar" class="hidden">

 <div class="topbar">

  <button class="back" onclick="goHome()">← Inicio</button>

  <button class="music" onclick="toggleMusic()">♫ Música</button>

 </div>

 <h1>Calendario de Adviento</h1>

 <p>Emma y Alejandro ❤️</p>

 <div id="progress"></div>

 <div class="grid" id="grid"></div>

 <p class="small-note">

 Las sorpresas se desbloquean cada día de diciembre.

 </p>

</section>

<div id="modal" class="hidden">

 <article class="paper">

  <button class="close" onclick="closeDay()">×</button>

  <div id="content"></div>

 </article>

</div>

<audio id="song" src="videoplayback.mp4" preload="none"></audio>

<script>
 
const openedKey='emma_advent_opened_v2';
let opened=JSON.parse(localStorage.getItem(openedKey)||'[]');
let albumIndex=0;
let timelineIndex=0;
let dictionaryIndex=0;
let museumIndex=0;
let quizIndex=0;
let quizAnswers=[];
let rouletteUsed=[];
let whoIndex=0;

const dayTitles=[
'Una razón para elegirte',
'¿Cuánto sabes de nosotros?',
'Un capítulo de nuestra historia',
'10 recuerdos contigo',
'5 cosas que quiero vivir contigo',
'Tú decides por nosotros',
'Lo que nunca quiero que olvides',
'Una canción, mil sentimientos',
'Nuestra historia',
'Si pudiera volver a vivir un día contigo',
'Nuestro diccionario',
'12 razones por las que me haces feliz',
'Nuestro próximo día juntos',
'10 cosas que me recuerdan a ti',
'Si tuviera que volver a elegirte',
'Un ratito de mi voz para ti',
'El mapa de nuestros sueños',
'El museo de nuestras tonterías',
'¿Quién es más probable que…?',
'Una cita conmigo sin salir de casa',
'Nuestra película',
'Quiero contarte algo…',
'Una última misión antes de Navidad',
'Mi regalo eres tú'
];

function photo(name,alt='Recuerdo'){
 return `<img class="media" src="${name}" alt="${alt}">`;
}
function video(name){
 return `<video class="media" controls playsinline src="${name}"></video>`;
}
function photoInline(name){
 return `<img src="${name}" style="width:100%;max-height:190px;object-fit:cover;border-radius:7px">`;
}
function para(text){
 return `<p>${text}</p>`;
}
function showCalendar(){
 document.getElementById('home').classList.add('hidden');
 document.getElementById('calendar').classList.remove('hidden');
 renderDays();
}
function goHome(){
 document.getElementById('calendar').classList.add('hidden');
 document.getElementById('home').classList.remove('hidden');
}
function renderDays(){
 const grid=document.getElementById('grid');
 grid.innerHTML='';
 const now=new Date();
 const preview=new URLSearchParams(location.search).has('prueba');
 const unlocked=preview?24:
 (now.getFullYear()>2026?24:
 (now.getFullYear()<2026?0:
 (now.getMonth()===11?now.getDate():0)));

 for(let d=1;d<=24;d++){
  const canOpen=d<=unlocked||opened.includes(d);
  const b=document.createElement('button');
  b.className='day'+(opened.includes(d)?' opened':'')+(!canOpen?' locked':'');
  b.innerHTML=`<span class="gift">${opened.includes(d)?'🎁':'🎀'}</span><span class="num">${d}</span>`;
  b.onclick=()=>canOpen?openDay(d):alert('Un poquito de paciencia, tu sorpresa llegará ❤️');
  grid.appendChild(b);
 }
 document.getElementById('progress').textContent=
 `${opened.length} de 24 sorpresas abiertas`;
}
function openDay(d){
 document.getElementById('modal').classList.remove('hidden');
 document.getElementById('content').innerHTML=renderContent(d);
}
function closeDay(){
 document.getElementById('modal').classList.add('hidden');
 document.getElementById('content').innerHTML='';
}
function markOpened(d){
 if(!opened.includes(d)){
  opened.push(d);
  localStorage.setItem(openedKey,JSON.stringify(opened));
  renderDays();
 }
}
function toggleMusic(){
 const a=document.getElementById('song');
 if(a.paused){
  a.play().catch(()=>alert('Comprueba que videoplayback.mp4 esté en el repositorio.'));
 }else{
  a.pause();
 }
}

const q2=[
['¿Dónde nos conocimos?',['A través de un amigo','En el instituto','En una fiesta','Por redes sociales'],0],
['¿Cuándo empezamos oficialmente nuestra relación?',['26 de enero de 2025','15 de julio de 2025','3 de septiembre de 2025','2 de enero de 2026'],2],
['¿Qué vimos juntos en nuestro pueblo en uno de nuestros primeros momentos especiales?',['Un concierto','Fuegos artificiales','Un espectáculo de luces','Una lluvia de estrellas'],1],
['¿Cuál es uno de nuestros viajes soñados?',['Roma','Nueva York','Londres','Lisboa'],1],
['¿Qué nos gusta hacer juntos?',['Jugar a videojuegos','Ver series sin hablar','Estar abrazados y disfrutar de nuestra compañía','Hacer deporte'],2]
];

const q6=[
['¿Qué elegirías para demostrarme cariño?',['Una carta bonita','Un regalo caro','Una sorpresa enorme','Una canción'],0],
['Si pudiéramos repetir un momento nuestro, ¿cuál elegirías?',['El día que nos conocimos','Nuestra primera cita','Un viaje','Una tarde cualquiera'],0],
['¿Qué apodo te gustaría que utilizáramos?',['Uno romántico','Uno gracioso','Uno secreto','Ninguno'],1],
['¿Qué harías si aparezco un día con una sorpresa sin avisar?',['Me quedaría sorprendida','Me lanzaría a abrazarte','Te preguntaría qué has hecho','Me reiría'],1],
['¿Qué promesa te gustaría que nos hiciéramos?',['Viajar mucho','No discutir nunca','Seguir cuidando nuestra relación','Regalarnos cosas'],2]
];

function quizMarkup(which){
 quizIndex=0;
 quizAnswers=[];
 return `<div id="quiz">${quizQuestion(which)}</div>`;
}
function quizQuestion(which){
 const arr=which===2?q2:q6;
 const q=arr[quizIndex];
 return `<p><b>Pregunta ${quizIndex+1} de ${arr.length}</b></p>
 <p>${q[0]}</p>`+
 q[1].map((x,i)=>`<button class="choice" onclick="answerQuiz(${which},${i})">${x}</button>`).join('');
}
function answerQuiz(which,i){
 const arr=which===2?q2:q6;
 quizAnswers.push(i);
 quizIndex++;
 if(quizIndex<arr.length){
  document.getElementById('quiz').innerHTML=quizQuestion(which);
  return;
 }
 let msg='';
 if(which===2){
  const score=quizAnswers.filter((x,j)=>x===arr[j][2]).length;
  msg=score===5?'Me conoces demasiado bien, aunque todavía puedo sorprenderte.':
  score>=3?'Se nota que tenemos muchos recuerdos juntos.':
  score>=1?'Tenemos que crear muchos más recuerdos.':
  '¡Nos toca repasar nuestra historia! 😂';
  msg+='<br><br>Da igual cuántas hayas acertado, mi parte favorita siempre será seguir creando recuerdos contigo.';
 }else{
  msg='Me gusta imaginar que elegirías una carta bonita para demostrarme cariño, porque a veces las palabras dicen muchísimo.<br><br>Me encantaría volver al día en que nos conocimos, aunque ninguno de los dos supiera todo lo que acabaríamos viviendo.<br><br>También tendremos que encontrar ese apodo gracioso que sea solo nuestro JAJAJA.<br><br>Y si algún día aparezco con una sorpresa, espero ese abrazo.<br><br>Pero, sobre todo, quiero que sigamos cuidando lo nuestro, que no dejemos de elegirnos y que construyamos muchos recuerdos más.<br><br>Porque no quiero que esto sea solo una historia bonita, quiero que siga siendo nuestra historia. ❤️';
 }
 document.getElementById('quiz').innerHTML=`<h3>¡Has terminado!</h3><p>${msg}</p>`;
}

function renderContent(d){
 let out=`<h2>${dayTitles[d-1]}</h2>`;
 switch(d){

 case 1:
 return out+
 photo('IMG_4154.jpeg','Nuestra foto')+
 para('Hola, Emma ❤️<br><br>Este es tu primer día del calendario y te quiero explicar un poco de qué va esto.<br><br>Hay 24 días, como en cualquier calendario de Adviento. Cada día hay una sorpresa preparada y me gustaría que cada día te metieras y abrieras la sorpresa que corresponde.<br><br>Espero que te guste este pequeño detalle. Aunque me ha dolido la cabeza preparándolo, lo hago porque te amo, Emma, y porque no sé cómo agradecerte este sentimiento que tengo hacia ti.<br><br>Porque, sin exagerarte, eres la persona que más quiero en esta vida.<br><br>Te amo. ❤️');

 case 2:
 return out+quizMarkup(2);

 case 3:
 return out+para('Ya hace un año de que lo dejamos y, a ver, me pone triste recordarlo, pero en parte estoy contento porque gracias al destino, un año después, estamos juntos otra vez.<br><br>Yo sabía que iba a volver contigo, pero no sabía que iba a ser un año después.<br><br>Con esto espero que podamos disfrutar de una Navidad que nos merecemos juntos. Además, será nuestra primera Navidad juntos, algo que, en verdad, me hace muchísima ilusión.<br><br>También te recuerdo que te amo, por si no lo sabías, y que estás muy guapa últimamente. Te voy a tener que encerrar donde sea, ¿eh? JAJAJA.<br><br>Te amo, Emma. ❤️');

 case 4:
 return out+`<div id="album">${albumMarkup()}</div>`;

 case 5:
 return out+
 ['Viajar a Nueva York.','Hacer una ruta con Apolo.','Más cenas de sushi.','Una cita sorpresa.','Mudarnos donde sea, pero contigo.']
 .map((x,i)=>`<p><b>${i+1}.</b> ${x}</p>`).join('');

 case 6:
 return out+quizMarkup(6);

 case 7:
 return out+para('Día 7, como el bicho. Bueno, hoy como sorpresa te toca una carta.<br><br>Lo siento mucho si no es algo divertido o algo así chulo. Creo que hay pocas cartas para lo mucho que soy yo de escribirte cosas.<br><br>En esta carta lo que te quiero decir es que eres el amor de mi vida y, sí, me suda la polla, así lo digo.<br><br>Dirás: «¿Cómo sé que eres el amor de mi vida?». Pues bueno, tienes todo lo que me gusta: eres tóxica, un pelín boba, también te mueves poco de la cama… JAJAJAJAJA. Na, es coña.<br><br>Si te soy sincero, contigo siento un amor que nunca había sentido. Y no es algo de un rato, es algo de todos los días: de levantarme y sentir que me explota el corazón de lo mucho que te quiero. Es heavy, en verdad, pero no me arrepiento.<br><br>También te digo que prometo estar para ti y para todo lo que necesites.<br><br>Por eso, con esto y un bizcocho, te amo hasta el infinito y más allá. ❤️')+
 photo('IMG_4154.jpeg');

 case 8:
 return out+
 photo('IMG_5440.jpeg')+
 `<audio controls class="media" src="videoplayback.mp4"></audio>`+
 para('He escogido esta canción porque te has adueñado de ella y, cada vez que la veo, la escucho o cualquier cosa relacionada con ella, me acuerdo de ti.<br><br>También la he elegido porque es muy bonita y porque me gustaría tatuármela junto contigo.<br><br>Esta canción ha habido veces que hasta me ha hecho llorar, porque me recuerda a ti. Me genera una sensación de nostalgia y, a la vez, alegría por haberla compartido contigo. ❤️');

 case 9:
 return out+`<div id="timeline">${timelineMarkup()}</div>`;

 case 10:
 return out+`<div id="videoalbum">${videoAlbumMarkup()}</div>`;

 case 11:
 return out+`<div id="dictionary">${dictionaryMarkup()}</div>`;

 case 12:
 return out+para('Pulsa para descubrir una razón cada vez. No se repiten hasta que hayan salido las doce.')+
 `<div id="reason" style="text-align:center;font-size:1.25rem;padding:25px 5px">❤️</div>`+
 `<div class="actions"><button onclick="spinReason()">Descubrir una razón</button></div>`;

 case 13:
 return out+
 para('Tengo una sorpresa preparada para nosotros… pero tendrás que descubrirla con estas tres pistas.')+
 ['El 23 de enero de 2027.','Ese día quiero invitarte a comer.','Nos espera Madrid… y algo de sushi.']
 .map((x,i)=>`<div class="envelope"><b>Pista ${i+1}</b><p>${x}</p></div>`).join('')+
 para('Parece que tenemos una cita pendiente… ❤️');

 case 14:
 return out+
 ['Goofy Ahh Luv Joint','Sushi','Los fuegos artificiales','El olor a vainilla','Soy Luna','Un perezoso','Honor','Cualquier momento del día','El peluche de Pikachu que me regalaste','El sitio donde vimos los fuegos artificiales']
 .map((x,i)=>`<p><b>${i+1}.</b> ${x}</p>`).join('');

 case 15:
 return out+para('Aquí va el texto que quiero escribirte. ❤️')+
 `<p class="small-note">Pendiente de añadir tu texto.</p>`;

 case 16:
 return out+para('Jejejeje, otra carta. Lo bueno es que han pasado ya 7 días desde la otra, así no te lleno de cartas.<br><br>Esto es una fumada, no sabes lo complicado que es esto. Lo hago porque te quiero y porque te tengo miedo. JAJAJAJAJA. Na, es broma.<br><br>Estoy deseando verte y poder darte besos, que me relaja mazo. Aparte de que me quites los puntos negros, que seguro que a día de hoy tendré más para que me quites. He hasta pensado en llenarme la cara de mierda para que me los quites, porque me mola menos cuando me cantas al oído lo de Minnie.<br><br>Pero bueno, igualmente, te doy las gracias por todo, amor. ❤️');

 case 17:
 return out+
 `<div class="photo-grid">`+
 [['Asturias','IMG_6259.jpeg'],['Ver juntos las auroras boreales','IMG_6260.jpeg'],['Egipto','IMG_6261.jpeg'],['Disneyland Paris','IMG_6262.jpeg'],['Nueva York','IMG_6263.jpeg'],['Japón','IMG_6264.jpeg']]
 .map(x=>`<figure>${photoInline(x[1])}<figcaption>${x[0]}</figcaption></figure>`).join('')+
 `</div>`;

 case 18:
 return out+`<div id="museum">${museumMarkup()}</div>`;

 case 19:
 return out+`<div id="who">${whoMarkup()}</div>`;

 case 20:
 return out+para('Abre los cinco sobres para elegir cómo sería nuestra cita perfecta en casa.')+
 ['Película: la que tú quieras.','Cena: sushi, pizza, hamburguesa o tacos.','Postre: el que más te apetezca.','Canción: elige una que quieras escuchar.','Final: una carta bonita de Alejandro.']
 .map((x,i)=>`<div class="envelope"><b>Sobre ${i+1}</b><p>${x}</p></div>`).join('')+
 para('Ya tienes organizada nuestra cita perfecta. Ahora solo queda una cosa: que llegue el momento de disfrutarla juntos. Te amo. ❤️');

 case 21:
 return out+para('El tráiler de nuestra película está pendiente de añadir. ❤️');

 case 22:
 return out+para('Hola, Emma. ❤️<br><br>Ya queda poco para Navidad y quiero que esta carta sea una de las más importantes.<br><br>Me gustaría decirte que estos tres años contigo se me han pasado volando, y más aún a tu lado.<br><br>Quiero que sepas que esto que siento por ti no es cualquier cosa. Eres el amor de mi vida. Me encantaría poder expresar con palabras todo lo que siento por ti, pero es que siempre me quedo corto.<br><br>A pesar de todas estas idas y venidas, me ha encantado compartir mi vida contigo y todo lo que nos queda por vivir.<br><br>Me haces tan feliz que hasta lloro de alegría. Muchas gracias, de verdad, porque contigo me he sentido querido y muy a gusto, y más en este momento en el que estamos mejor que nunca.<br><br>No sabes lo feliz que soy de estar contigo.<br><br>Muchas gracias por todo. Te amo y siempre te amaré, toda la vida. ❤️<br><br>Y si has llegado hasta aquí, quiero pedirte una cosita: escríbeme por WhatsApp contándome qué has sentido al leer esta carta o mándame una foto de esa cara bonita de felicidad que seguro que tienes ahora mismo. JAJAJAJA.<br><br>Quiero guardar también ese momentito. ❤️');

 case 23:
 return out+para('Tu última misión antes de Navidad. ❤️')+
 `<ol>
 <li>Elige tu foto favorita de nosotros: ${photoInline('74a5d213-6c86-4797-84f7-3488b6461987.jpeg')}</li>
 <li>¿Dónde nos conocimos y quién nos presentó? En tu casa; tu hermano nos presentó.</li>
 <li>Escribe tres cosas que te encantan de Alejandro: <textarea placeholder="Tus tres cosas..."></textarea></li>
 <li>Elige nuestro próximo destino:
 <select><option>Asturias</option><option>Ver auroras boreales</option><option>Egipto</option><option>Disneyland Paris</option><option>Nueva York</option><option>Japón</option></select></li>
 <li>Escríbeme un mensaje bonito sobre lo que sientes, nuestra historia y lo que esperas del futuro: <textarea placeholder="Tu mensaje para mí..."></textarea></li>
 </ol>
 <p>Misión completada. Ahora tienes algo más que un regalo: un recuerdo escrito por mí para ti. Tu recompensa te espera el día 24… ❤️</p>`;

 case 24:
 return out+para('Gracias por formar parte de mi historia. Te elegiría una y mil veces. ❤️')+
 `<p class="small-note">Aquí irá tu carta final y el vídeo dedicado a Emma.</p>`;
 }
}

// DÍA 4: ÁLBUM DE RECUERDOS
const memories=[
['El día q me enamoré de ti','E75A585E-C62F-4E60-B7F7-FC06160FA2FD.jpeg'],
['Sr. pica','IMG_6109.jpeg'],
['Navidad out','ab967b62-fb1a-4761-84a8-dc573564d801.jpeg'],
['Apoloooooo','b1e1e0e0-db55-443c-bf92-ceb41b0a975d.jpeg'],
['Tus ojos','a48561c6-5856-4476-9de8-1cc002bc01d1.jpeg'],
['El koala','IMG_5159.jpeg'],
['Bollera','IMG_1378.jpeg'],
['El abrazo del oso','d2f18895-5c45-4854-b152-55058554a819.jpeg'],
['Nose q nombre ponerle','f45a6353-8afd-45c6-956b-bee5bc55aa8e.jpeg'],
['Papis','74a5d213-6c86-4797-84f7-3488b6461987.jpeg']
];

function albumMarkup(){
 const m=memories[albumIndex];
 return `${photo(m[1])}
 <p style="text-align:center">${m[0]}</p>
 <div class="actions">
 <button onclick="moveAlbum(-1)">← Anterior</button>
 <button onclick="moveAlbum(1)">Siguiente →</button>
 </div>
