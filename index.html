
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4b0712">
<title>Calendario de Adviento Emma ❤️</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Georgia,'Times New Roman',serif;
  background:#380b12;
  color:#fff;
  min-height:100vh;
}

button{font:inherit;cursor:pointer}
.hidden{display:none!important}

/* PANTALLA DE INICIO */
#home{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:25px 18px;
  background:linear-gradient(160deg,#26070c,#650e1b,#31070e);
}

.home-photo{
  width:min(88vw,430px);
  height:min(62vh,500px);
  object-fit:cover;
  filter:grayscale(100%);
  border:5px solid white;
  border-radius:5px;
  box-shadow:0 12px 35px #0008;
}

#home h1{
  font-size:clamp(28px,7vw,44px);
  margin:24px 0 10px;
  font-weight:normal;
  color:#fff;
}

#home p{
  max-width:380px;
  line-height:1.6;
  font-size:16px;
  color:#f8e8e8;
}

.open-calendar{
  margin-top:20px;
  padding:15px 28px;
  border:2px solid #fff;
  background:#a7192d;
  color:white;
  border-radius:8px;
  font-size:17px;
  box-shadow:0 5px 15px #0005;
}

/* REGALO DE LA PANTALLA INICIAL */
.big-gift{
  width:150px;
  height:130px;
  background:#c90020;
  margin:35px auto;
  position:relative;
  border:5px solid white;
  border-radius:8px;
  box-shadow:0 8px 20px rgba(0,0,0,0.3);
}

.gift-lid{
  position:absolute;
  width:170px;
  height:28px;
  background:#c90020;
  border:4px solid white;
  left:-15px;
  top:-30px;
  border-radius:5px;
}

.gift-ribbon-vertical{
  position:absolute;
  width:24px;
  height:100%;
  background:white;
  left:50%;
  transform:translateX(-50%);
}

.gift-ribbon-horizontal{
  position:absolute;
  width:100%;
  height:20px;
  background:white;
  top:35%;
}

.gift-bow{
  position:absolute;
  width:65px;
  height:30px;
  border:9px solid white;
  border-radius:50%;
  top:-55px;
  left:50%;
  transform:translateX(-50%);
}

/* CALENDARIO */
#calendar{
  min-height:100vh;
  padding:22px 14px 40px;
  background:
    radial-gradient(circle at top,#791827,transparent 55%),
    #350910;
}

.calendar-header{
  text-align:center;
  padding:10px 0 20px;
}

.calendar-header h1{
  font-size:clamp(26px,7vw,38px);
  font-weight:normal;
  margin:12px 0;
}

.calendar-header p{
  color:#f3dfe1;
  font-size:15px;
}

.top-buttons{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.small-button{
  background:#741526;
  border:1px solid #dca9ad;
  color:white;
  border-radius:30px;
  padding:9px 13px;
  font-size:14px;
}

#progress{
  text-align:center;
  margin:12px 0 20px;
  color:#f8dfe2;
  font-size:14px;
}

/* REGALOS */
.gift-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
  max-width:600px;
  margin:0 auto;
}

.gift{
  position:relative;
  min-height:105px;
  border:2px solid #d7a65b;
  border-radius:9px;
  background:linear-gradient(145deg,#d52b42,#850e20);
  color:white;
  font-size:25px;
  box-shadow:0 5px 10px #0005;
  transition:transform .2s,opacity .2s;
}

.gift:not(:disabled):active{transform:scale(.94)}

.gift::before{
  content:"";
  position:absolute;
  left:44%;
  top:0;
  width:12%;
  height:100%;
  background:#e4b75f;
  opacity:.9;
}

.gift::after{
  content:"";
  position:absolute;
  left:0;
  top:43%;
  height:14%;
  width:100%;
  background:#e4b75f;
  opacity:.9;
}

.gift-number{
  position:relative;
  z-index:2;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:38px;
  height:38px;
  border-radius:50%;
  background:#650d1b;
  border:1px solid #f1d5a2;
  font-size:19px;
}

.gift:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.gift.opened{
  background:linear-gradient(145deg,#751b29,#400913);
}

/* VENTANA DE LAS SORPRESAS */
#modal{
  position:fixed;
  inset:0;
  z-index:20;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  background:#160307ef;
  overflow-y:auto;
}

#modal.visible{display:flex}

.modal-card{
  position:relative;
  width:100%;
  max-width:600px;
  max-height:92vh;
  overflow-y:auto;
  padding:24px 20px;
  background:#fff9f0;
  color:#45101a;
  border-radius:8px;
  box-shadow:0 15px 50px #0009;
}

.back-button{
  position:sticky;
  top:0;
  display:block;
  border:none;
  background:#7d1829;
  color:white;
  border-radius:20px;
  padding:9px 15px;
  margin-bottom:15px;
}

#content{
  font-family:Georgia,'Times New Roman',serif;
  line-height:1.7;
  font-size:16px;
  overflow-wrap:anywhere;
}

#content h2{
  text-align:center;
  font-size:27px;
  font-weight:normal;
  color:#801b2b;
  margin:5px 0 20px;
}

#content h3{
  color:#801b2b;
  font-weight:normal;
}

#content p{margin:12px 0}

#content img{
  max-width:100%;
  height:auto;
  border-radius:6px;
}

#content video{
  width:100%;
  border-radius:8px;
}

#content button{
  border:none;
  border-radius:7px;
  background:#8e1c30;
  color:white;
  padding:11px 16px;
  margin:5px;
  font-size:15px;
}

#content textarea,
#content input,
#content select{
  display:block;
  width:100%;
  padding:12px;
  margin:12px 0;
  border:1px solid #c9a5a8;
  border-radius:6px;
  font:inherit;
  color:#45101a;
  background:white;
}

.photo-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

.photo-grid figure{
  margin:0;
  text-align:center;
}

.photo-grid img{
  width:100%;
  aspect-ratio:4/5;
  object-fit:cover;
}

.photo-grid figcaption{
  padding:8px 3px;
  line-height:1.5;
}

.choice{
  display:block;
  width:100%;
}

.envelope{
  padding:20px;
  margin:15px 0;
  background:#fff0dc;
  border:1px solid #d6b7a0;
  border-radius:8px;
}

.actions{
  text-align:center;
  margin-top:15px;
}

@media(max-width:390px){
  .gift-grid{gap:8px}
  .gift{min-height:85px}
  .modal-card{padding:20px 14px}
}
</style>
</head>

<body>

<!-- PANTALLA DE BIENVENIDA -->
<section id="home">
  <img
    class="home-photo"
    src="8ab45570-f398-4989-87ca-93abf22fa6ca.jpeg"
    alt="Alejandro y Emma"
  >

  <h1>Calendario de Adviento Emma</h1>

  <p>
    Cada cajita guarda un recuerdo, una sorpresa
    o algo que quiero decirte.
  </p>

  <div class="big-gift">
    <div class="gift-lid"></div>
    <div class="gift-ribbon-vertical"></div>
    <div class="gift-ribbon-horizontal"></div>
    <div class="gift-bow"></div>
  </div>

  <button class="open-calendar" onclick="showCalendar()">
    Abrir mi regalo ❤️
  </button>
</section>

<!-- CALENDARIO DE LOS 24 DÍAS -->
<section id="calendar" class="hidden">

  <div class="top-buttons">
    <button class="small-button" onclick="goHome()">
      ← Inicio
    </button>

    <button class="small-button" id="musicBtn" onclick="toggleMusic()">
      ♫ Música
    </button>
  </div>

  <header class="calendar-header">
    <h1>24 razones para elegirte cada día</h1>
    <p>Emma y Alejandro ❤️</p>
  </header>

  <div id="progress">
    0 de 24 sorpresas descubiertas
  </div>

  <div id="giftGrid" class="gift-grid"></div>
</section>

<!-- VENTANA DE CADA DÍA -->
<div id="modal">
  <div class="modal-card">
    <button class="back-button" onclick="closeDay()">
      ← Volver al calendario
    </button>
    <div id="content"></div>
  </div>
</div>

<!-- REPRODUCTOR DE MÚSICA -->
<audio id="song" loop preload="auto">
  <source src="Lorna%20-%202.0%20%231%20%20(KARAOKE)%20-%20byletters444.mp3" type="audio/mpeg">
</audio>

<script>

// VARIABLES GENERALES
const params = new URLSearchParams(location.search);
const testMode = params.get('prueba') === '1';
let opened = JSON.parse(localStorage.getItem('emmaOpened') || '[]');
let currentDay = 0;
let albumIndex = 0;
let timelineIndex = 0;
let dictionaryIndex = 0;
let museumIndex = 0;
let whoIndex = 0;
let reasonIndex = [];
let day20Step = 0;
let day20Answers = {};

const dayTitles = [
  "Una sorpresa para ti",
  "¿Cuánto nos conocemos?",
  "Un recuerdo especial",
  "Nuestro pequeño álbum",
  "Una canción para nosotros",
  "Cinco preguntas",
  "Un mensaje para ti",
  "Un recuerdo en imágenes",
  "Nuestra historia",
  "Nuestros vídeos",
  "Nuestro diccionario",
  "12 razones para elegirte",
  "Una sorpresa",
  "Un momento especial",
  "Por qué te elegiría otra vez",
  "Una sorpresa para ti",
  "Nuestros viajes soñados",
  "Nuestro museo de recuerdos",
  "¿Quién es más probable?",
  "Cinco sobres para ti",
  "El tráiler de nuestra historia",
  "Una carta para ti",
  "Una pequeña misión",
  "Mi última sorpresa"
];

function showCalendar(){
  document.getElementById('home').classList.add('hidden');
  document.getElementById('calendar').classList.remove('hidden');
  renderDays();
}

function goHome(){
  document.getElementById('calendar').classList.add('hidden');
  document.getElementById('home').classList.remove('hidden');
}

function renderDays(){
  const grid = document.getElementById('giftGrid');
  grid.innerHTML = '';

  for(let d=1;d<=24;d++){
    const unlocked = testMode ||
      (new Date().getMonth()===11 && new Date().getDate()>=d) ||
      opened.length===24;

    const btn = document.createElement('button');
    btn.className = 'gift' + (opened.includes(d) ? ' opened' : '');
    btn.disabled = !unlocked;
    btn.innerHTML = `<span class="gift-number">${d}</span>`;
    btn.setAttribute('aria-label',`Día ${d}`);
    btn.onclick = () => openDay(d);
    grid.appendChild(btn);
  }

  document.getElementById('progress').textContent =
    `${opened.length} de 24 sorpresas descubiertas`;
}

function openDay(d){
  currentDay = d;
  albumIndex = 0;
  timelineIndex = 0;
  dictionaryIndex = 0;
  museumIndex = 0;
  whoIndex = 0;

  document.getElementById('content').innerHTML = renderContent(d);
  document.getElementById('modal').classList.add('visible');
  markOpened(d);
}

function closeDay(){
  document.getElementById('modal').classList.remove('visible');
}

function markOpened(d){
  if(!opened.includes(d)){
    opened.push(d);
    localStorage.setItem('emmaOpened',JSON.stringify(opened));
  }
  renderDays();
}

function toggleMusic(){
  const song = document.getElementById('song');
  const btn = document.getElementById('musicBtn');

  if(song.paused){
    song.play().then(()=>{
      btn.textContent = '♫ Música: ON';
    }).catch(()=>{
      btn.textContent = '♫ Pulsa para escuchar';
      alert('No se ha podido reproducir. Comprueba que el MP3 está subido y vuelve a pulsar.');
    });
  }else{
    song.pause();
    btn.textContent = '♫ Música: OFF';
  }
}

// DÍA 2
const quizDay2 = [
  {
    q:"¿Qué fue lo que más me llamó la atención de ti?",
    a:["Tu sonrisa","Tu pelo","Tus ojos"],
    correct:0
  },
  {
    q:"¿Qué fecha marcó un antes y un después?",
    a:["26 de enero","15 de julio","3 de septiembre"],
    correct:2
  },
  {
    q:"¿Qué es lo que más me gusta hacer contigo?",
    a:["Abrazarte","Jugar","Ver películas"],
    correct:0
  },
  {
    q:"¿Qué plan elegiría contigo?",
    a:["Salir a pasear","Comer sushi","Quedarnos juntos"],
    correct:1
  },
  {
    q:"¿Qué quiero seguir haciendo contigo?",
    a:["Discutir","Compartir momentos","Dormir todo el día"],
    correct:1
  }
];

let quiz2Answers = [];

function quiz2Markup(){
  quiz2Answers = [];
  return `
    <h2>¿Cuánto nos conocemos? ❤️</h2>
    <p>Contesta estas cinco preguntitas.</p>
    ${quizDay2.map((q,i)=>`
      <div class="envelope">
        <h3>${i+1}. ${q.q}</h3>
        ${q.a.map((a,j)=>`
          <button class="choice" onclick="answerQuiz2(${i},${j})">${a}</button>
        `).join('')}
        <p id="quiz2-${i}"></p>
      </div>
    `).join('')}
    <div id="quiz2Result"></div>
  `;
}

function answerQuiz2(q,a){
  quiz2Answers[q]=a;
  const p=document.getElementById(`quiz2-${q}`);
  if(p)p.textContent='Respuesta guardada ❤️';

  if(quiz2Answers.filter(x=>x!==undefined).length===5){
    const hits=quiz2Answers.filter((x,i)=>x===quizDay2[i].correct).length;
    document.getElementById('quiz2Result').innerHTML=
      `<h3>¡Has terminado!</h3><p>Has acertado ${hits} de 5. ❤️</p>`;
  }
}

// CONTENIDO DE LOS 24 DÍAS
function renderContent(d){
  switch(d){

    case 1:
      return `
        <h2>Una sorpresa para ti ❤️</h2>
        <p>Hoy empieza algo que he preparado con mucho cariño.</p>
        <p>Quiero que cada día descubras un poquito más de todo lo que significas para mí.</p>
        <img src="IMG_4154.jpeg" alt="Nuestro recuerdo">
        <p>Espero que disfrutes este calendario tanto como yo he disfrutado preparándolo.</p>
        <p>Te amo, Emma. ❤️</p>
      `;

    case 2:
      return quiz2Markup();

    case 3:
      return `
        <h2>Un recuerdo especial</h2>
        <p>Hay momentos que parecen pequeños, pero que se quedan guardados para siempre.</p>
        <p>Y muchos de mis favoritos tienen algo en común: estabas tú.</p>
        <p>Gracias por formar parte de mi vida. ❤️</p>
      `;

    case 4:
      return albumDay4();

    case 5:
      return `
        <h2>Una canción para nosotros 🎵</h2>
        <p>Hay canciones que, por alguna razón, terminan recordándonos a alguien.</p>
        <p>Esta me hace pensar en ti.</p>
        <button onclick="playDay8Music()">Escuchar nuestra canción</button>
        <p>Porque hay melodías que se quedan contigo, igual que tú te has quedado conmigo.</p>
      `;

    case 6:
      return quizDay6();

    case 7:
      return `
        <h2>Un mensaje para ti</h2>
        <p>Quiero recordarte que eres una persona muy importante para mí.</p>
        <p>Me encanta compartir tiempo contigo, reírnos por cualquier tontería y disfrutar de esos momentos que solo nosotros entendemos.</p>
        <p>Ojalá nos queden muchísimos más. ❤️</p>
      `;

    case 8:
      return `
        <h2>Un recuerdo en imágenes</h2>
        <img src="IMG_5440.jpeg" alt="Nosotros" style="width:100%">
        <p>Una imagen, un montón de recuerdos y una persona a la que quiero muchísimo.</p>
        <button onclick="playDay8Music()">Escuchar la canción</button>
      `;

    case 9:
      return timelineDay9();

    case 10:
      return videoAlbumDay10();

    case 11:
      return dictionaryDay11();

    case 12:
      return reasonsDay12();

    case 13:
      return `
        <h2>Una sorpresa para ti ❤️</h2>
        <p>Hoy solo quiero decirte que me encanta tenerte en mi vida.</p>
        <p>Gracias por cada abrazo, cada risa y cada momento juntos.</p>
      `;

    case 14:
      return `
        <h2>Un momento especial</h2>
        <p>Si pudiera guardar un momento en una cajita para volver a vivirlo cuando quisiera, elegiría uno de esos ratitos en los que estamos juntos y todo parece estar bien.</p>
        <p>Porque contigo hasta lo más sencillo se convierte en algo especial.</p>
      `;

    case 15:
      return `
        <h2>Por qué te elegiría otra vez ❤️</h2>
        <p>Este día me toca decirte por qué te volvería a elegir una y otra vez, aunque no creo que haga falta después de todo este tiempo entre tú y yo. Y si hemos vuelto siempre es porque estamos destinados el uno para el otro.</p>
        <p>Te elogiaría por todo lo que siento por ti, pero ya no solo por eso, sino porque contigo soy yo mismo. Me siento tan a gusto contigo y soy tan feliz a tu lado.</p>
        <p>Me río un montón, ya sea un momentito contigo o un rato largo. Siempre me lo paso bien cuando estoy contigo y estoy muy agradecido por tenerte en mi vida.</p>
        <p>Te repito lo de siempre: te amo y, por favor, no se te olvide nunca. ❤️</p>
      `;

    case 16:
      return `
        <h2>Una sorpresa para ti</h2>
        <p>Quería reservarte otro pequeño detalle.</p>
        <p>Gracias por hacer que tantos días normales se conviertan en recuerdos bonitos.</p>
        <p>Te elegiría una y mil veces. ❤️</p>
      `;

    case 17:
      return travelDay17();

    case 18:
      return museumDay18();

    case 19:
      return whoDay19();

    case 20:
      day20Step=0;
      day20Answers={};
      return day20Markup();

    case 21:
      return `
        <h2>El tráiler de nuestra historia 🎬</h2>
        <p>PRÓXIMAMENTE...</p>
        <p>Una historia con dos protagonistas, un montón de recuerdos y muchas aventuras por vivir.</p>
        <p>Muy pronto podrás ver nuestro tráiler. ❤️</p>
      `;

    case 22:
      return `
        <h2>Una carta para ti ❤️</h2>
        <p>Hola Emma, ya queda poco para Navidad y esta carta quiero que sea de las más importantes.</p>
        <p>Me gustaría que supieras que estos tres años contigo se me han pasado volando, y más a tu lado.</p>
        <p>Esto que siento por ti no es cualquier cosa. Eres una persona muy especial en mi vida y me encantaría poder expresarte con palabras todo lo que siento.</p>
        <p>Te amo muchísimo. ❤️</p>
        <p>Y ahora quiero que me escribas por WhatsApp o me mandes una foto de esa cara bonita de felicidad.</p>
      `;

    case 23:
      return `
        <h2>Una pequeña misión ❤️</h2>
        <p>Hoy tienes unas pequeñas misiones:</p>
        <div class="envelope">
          <p>1. Elegir un día para estar juntos.</p>
          <p>2. Pensar en un plan que nos haga ilusión.</p>
          <p>3. Guardar un recuerdo bonito de ese día.</p>
        </div>
        <textarea placeholder="Nuestra próxima aventura..."></textarea>
        <textarea placeholder="Un plan que quiero hacer contigo..."></textarea>
        <img src="74a5d213-6c86-4797-84f7-3488b6461987.jpeg" alt="Un recuerdo juntos" style="width:100%">
      `;

    case 24:
      return `
        <h2>Mi última sorpresa ❤️</h2>
        <p>Y después de estos 24 días, solo quiero recordarte una última cosa: si pudiera volver atrás y empezar nuestra historia desde cero, volvería a buscarte, volvería a conocerte y volvería a enamorarme de ti.</p>
        <p>Gracias por hacerme tan feliz y por compartir tu vida conmigo. Te amo, Emma. ❤️</p>
        <div class="envelope">
          <h3>Un último recuerdo...</h3>
          <p>El vídeo especial irá aquí.</p>
          <p>Gracias por formar parte de mi historia. Te elegiría una y mil veces.</p>
        </div>
      `;

    default:
      return `<h2>Una sorpresa para ti</h2>`;
  }
}

// DÍA 4: ÁLBUM DE FOTOS
const memories = [
  ["E75A585E-C62F-4E60-B7F7-FC06160FA2FD.jpeg","El día q me enamoré de ti"],
  ["IMG_6109.jpeg","Sr. pica"],
  ["ab967b62-fb1a-4761-84a8-dc573564d801.jpeg","Navidad out"],
  ["b1e1e0e0-db55-443c-bf92-ceb41b0a975d.jpeg","Apoloooooo"],
  ["a48561c6-5856-4476-9de8-1cc002bc01d1.jpeg","Tus ojos"],
  ["IMG_5159.jpeg","El koala"],
  ["IMG_1378.jpeg","Bollera"],
  ["d2f18895-5c45-4854-b152-55058554a819.jpeg","El abrazo del oso"],
  ["f45a6353-8afd-45c6-956b-bee5bc55aa8e.jpeg","Nose q nombre ponerle"],
  ["74a5d213-6c86-4797-84f7-3488b6461987.jpeg","Papis"]
];

function albumDay4(){
  albumIndex=0;
  return `
    <h2>Nuestro pequeño álbum 📸</h2>
    <p>Diez recuerdos que guardo con muchísimo cariño.</p>
    <div id="album4"></div>
    <div class="actions">
      <button onclick="changeAlbum4(-1)">Anterior</button>
      <button onclick="changeAlbum4(1)">Siguiente</button>
    </div>
  `;
}

function renderAlbum4(){
  const item=memories[albumIndex];
  document.getElementById('album4').innerHTML=`
    <figure>
