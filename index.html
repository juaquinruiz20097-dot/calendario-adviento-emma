
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario de Adviento Emma ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Georgia, 'Times New Roman', serif;
  background: #380b12;
  color: #fff;
  min-height: 100vh;
}

button {
  font-family: inherit;
  cursor: pointer;
}

.hidden {
  display: none !important;
}

/* PANTALLA DE INICIO */

#home {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 25px 18px;
  background: linear-gradient(160deg, #26070c, #650e1b, #31070e);
}

.home-photo {
  width: min(88vw, 430px);
  height: min(62vh, 500px);
  object-fit: cover;
  filter: grayscale(100%);
  border: 5px solid white;
  border-radius: 5px;
  box-shadow: 0 12px 35px #0008;
}

#home h1 {
  font-size: clamp(28px, 7vw, 44px);
  margin: 24px 0 10px;
  font-weight: normal;
  color: #fff;
}

#home p {
  max-width: 380px;
  line-height: 1.6;
  font-size: 16px;
  color: #f8e8e8;
}

.open-calendar {
  margin-top: 20px;
  padding: 15px 28px;
  border: 2px solid #fff;
  background: #a7192d;
  color: white;
  border-radius: 8px;
  font-size: 17px;
  box-shadow: 0 5px 15px #0005;
}

/* CALENDARIO */

#calendar {
  min-height: 100vh;
  padding: 22px 14px 40px;
  background:
    radial-gradient(circle at top, #791827, transparent 55%),
    #350910;
}

.calendar-header {
  text-align: center;
  padding: 10px 0 20px;
}

.calendar-header h1 {
  font-size: clamp(26px, 7vw, 38px);
  font-weight: normal;
  margin: 12px 0;
}

.calendar-header p {
  color: #f3dfe1;
  font-size: 15px;
}

.top-buttons {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.small-button {
  background: #741526;
  border: 1px solid #dca9ad;
  color: white;
  border-radius: 30px;
  padding: 9px 13px;
  font-size: 14px;
}

#progress {
  text-align: center;
  margin: 12px 0 20px;
  color: #f8dfe2;
  font-size: 14px;
}

/* CUADRÍCULA DE REGALOS */

.gift-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  max-width: 600px;
  margin: 0 auto;
}

.gift {
  position: relative;
  min-height: 105px;
  border: 2px solid #d7a65b;
  border-radius: 9px;
  background: linear-gradient(145deg, #d52b42, #850e20);
  color: white;
  font-size: 25px;
  box-shadow: 0 5px 10px #0005;
  transition: transform .2s, opacity .2s;
}

.gift:not(:disabled):active {
  transform: scale(.94);
}

.gift::before {
  content: "";
  position: absolute;
  left: 44%;
  top: 0;
  width: 12%;
  height: 100%;
  background: #e4b75f;
  opacity: .9;
}

.gift::after {
  content: "";
  position: absolute;
  left: 0;
  top: 43%;
  height: 14%;
  width: 100%;
  background: #e4b75f;
  opacity: .9;
}

.gift-number {
  position: relative;
  z-index: 2;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: #650d1b;
  border: 1px solid #f1d5a2;
  font-size: 19px;
}

.gift:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.gift.opened {
  background: linear-gradient(145deg, #751b29, #400913);
}

/* VENTANA DE LAS SORPRESAS */

#modal {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 15px;
  background: #160307eF;
  overflow-y: auto;
}

#modal.visible {
  display: flex;
}

.modal-card {
  position: relative;
  width: 100%;
  max-width: 600px;
  max-height: 92vh;
  overflow-y: auto;
  padding: 24px 20px;
  background: #fff9f0;
  color: #45101a;
  border-radius: 8px;
  box-shadow: 0 15px 50px #0009;
}

.back-button {
  position: sticky;
  top: 0;
  display: block;
  border: none;
  background: #7d1829;
  color: white;
  border-radius: 20px;
  padding: 9px 15px;
  margin-bottom: 15px;
}

#content {
  font-family: Georgia, 'Times New Roman', serif;
  line-height: 1.7;
  font-size: 16px;
  overflow-wrap: anywhere;
}

#content h2 {
  text-align: center;
  font-size: 27px;
  font-weight: normal;
  color: #801b2b;
  margin: 5px 0 20px;
}

#content h3 {
  color: #801b2b;
  font-weight: normal;
}

#content p {
  margin: 12px 0;
}

#content img {
  max-width: 100%;
  height: auto;
  border-radius: 6px;
}

#content video {
  width: 100%;
  border-radius: 8px;
}

#content button {
  border: none;
  border-radius: 7px;
  background: #8e1c30;
  color: white;
  padding: 11px 16px;
  margin: 5px;
  font-size: 15px;
}

#content textarea,
#content input,
#content select {
  display: block;
  width: 100%;
  padding: 12px;
  margin: 12px 0;
  border: 1px solid #c9a5a8;
  border-radius: 6px;
  font: inherit;
  color: #45101a;
  background: white;
}

.photo-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.photo-grid figure {
  margin: 0;
  text-align: center;
}

.photo-grid img {
  width: 100%;
  aspect-ratio: 4 / 5;
  object-fit: cover;
}

.photo-grid figcaption {
  padding: 8px 3px;
  line-height: 1.5;
}

.choice {
  display: block;
  width: 100%;
}

.envelope {
  padding: 20px;
  margin: 15px 0;
  background: #fff0dc;
  border: 1px solid #d6b7a0;
  border-radius: 8px;
}

.actions {
  text-align: center;
  margin-top: 15px;
}

@media (max-width: 390px) {
  .gift-grid {
    gap: 8px;
  }

  .gift {
    min-height: 85px;
  }

  .modal-card {
    padding: 20px 14px;
  }
}
  .big-gift {
  width: 150px;
  height: 130px;
  background: #c90020;
  margin: 35px auto;
  position: relative;
  border: 5px solid white;
  border-radius: 8px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

.gift-lid {
  position: absolute;
  width: 170px;
  height: 28px;
  background: #c90020;
  border: 4px solid white;
  left: -15px;
  top: -30px;
  border-radius: 5px;
}

.gift-ribbon-vertical {
  position: absolute;
  width: 24px;
  height: 100%;
  background: white;
  left: 50%;
  transform: translateX(-50%);
}

.gift-ribbon-horizontal {
  position: absolute;
  width: 100%;
  height: 20px;
  background: white;
  top: 35%;
}

.gift-bow {
  position: absolute;
  width: 65px;
  height: 30px;
  border: 9px solid white;
  border-radius: 50%;
  top: -55px;
  left: 50%;
  transform: translateX(-50%);
}
</style>
</head>

// TÍTULOS DE LOS 24 DÍAS

const dayTitles = [
'Una razón para elegirte',
'¿Cuánto sabes de nosotros?',
'Un capítulo de nuestra historia',
'10 recuerdos contigo',
'5 cosas que quiero vivir contigo',
'Tú decides por nosotros',

'El mapa de nuestros sueños',
'El museo de nuestras tonterías',

// FUNCIONES GENERALES

function showCalendar() {
 document.getElementById('home').classList.add('hidden');
 document.getElementById('calendar').classList.remove('hidden');
 renderDays();
}

function goHome() {
 document.getElementById('calendar').classList.add('hidden');
 document.getElementById('home').classList.remove('hidden');
}

function renderDays() {
 const grid = document.getElementById('giftGrid');
 grid.innerHTML = '';

 dayTitles.forEach((title,i) => {
  const d = i + 1;
  const unlocked = testMode ||
   (new Date().getMonth() === 11 && new Date().getDate() >= d) ||
   opened.length === 24;

  const isOpened = opened.includes(d);
  const btn = document.createElement('button');
  btn.className = 'gift' + (isOpened ? ' opened' : '');
  btn.disabled = !unlocked;
  btn.innerHTML = `<span class="gift-number">${d}</span>`;
  btn.title = title;

  btn.onclick = () => {
   if (unlocked) openDay(d);
   else alert('Un poquito de paciencia, tu sorpresa llegará ❤️');
  };

  grid.appendChild(btn);
 });

 document.getElementById('progress').textContent =
 `${opened.length} de 24 sorpresas descubiertas`;
}

function openDay(d) {
 currentDay = d;
 document.getElementById('modal').classList.add('visible');
 renderContent(d);
}

function closeDay() {
 document.getElementById('modal').classList.remove('visible');
}

function markOpened(d) {
 if (!opened.includes(d)) {
  opened.push(d);
  localStorage.setItem('emmaOpened', JSON.stringify(opened));
 }
 renderDays();
}

function toggleMusic() {
 const audio = document.getElementById('song');
 const btn = document.getElementById('musicBtn');

 if (audio.paused) {
  audio.play().then(() => {
   btn.textContent = 'Ⅱ Pausar';
  }).catch(() => {
   alert('Pulsa otra vez para activar la música ❤️');
  });
 } else {
  audio.pause();
  btn.textContent = '♫ Música';
 }
}

let q2Score = 0;

function quizMarkup() {

 <p>Pregunta ${q2Index+1} de 5</p>
 <h3>${q.q}</h3>
 ${q.a.map((a,i)=>`<button class="choice" onclick="answerQuiz(${i})">${a}</button>`).join('')}`;
}

function quizQuestion() {
 document.getElementById('content').innerHTML = quizMarkup();
}

function answerQuiz(i) {
 if (i === q2[q2Index].correct) q2Score++;
 q2Index++;

 if (q2Index < q2.length) {
  quizQuestion();

}

 c.innerHTML = `<h2>El mapa de nuestros sueños</h2>
